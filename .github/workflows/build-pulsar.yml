name: Build Pulsar Kernel (alioth)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Dispositivo (defconfig base)'
        required: false
        default: 'alioth'

permissions:
  contents: write

concurrency:
  group: kernel-build-pulsar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEVICE: ${{ github.event.inputs.device || 'alioth' }}
    steps:
      - name: Checkout patches (Pulsar-Kernel)
        uses: actions/checkout@v4
        with:
          path: droidspace

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            flex bison bc zip unzip file python3 \
            libssl-dev libncurses-dev kmod

      - name: Clone kernel source (staging-bpf)
        run: |
          git clone --depth 1 --branch staging-bpf \
            https://github.com/kvsnr113/xiaomi_sm8250_kernel_e404.git kernel

      - name: Checkout KernelSU submodule (rsuntk/KernelSU)
        run: |
          cd kernel
          git submodule update --init
          ls -l drivers/kernelsu
          ls KernelSU/kernel/Kconfig

      - name: Apply kernel patches (patches/*/*.patch)
        run: |
          cd kernel
          if [ -d "$GITHUB_WORKSPACE/droidspace/patches/susfs" ]; then
            echo "==> Copying SuSFS source & header files"
            cp "$GITHUB_WORKSPACE/droidspace/patches/susfs/susfs.c" fs/susfs.c 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/droidspace/patches/susfs/susfs.h" include/linux/susfs.h 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/droidspace/patches/susfs/susfs_def.h" include/linux/susfs_def.h 2>/dev/null || true
          fi
          shopt -s nullglob
          for patch in "$GITHUB_WORKSPACE"/droidspace/patches/*/*.patch; do
            echo "==> Applying $patch"
            git apply --verbose "$patch"
          done

      - name: Install DroidSpaces config fragment
        run: |
          cp "$GITHUB_WORKSPACE/droidspace/configs/droidspace.config" \
            kernel/arch/arm64/configs/vendor/droidspace.config

      - name: Download Clang 20 (ZyCromerZ)
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz
          tar -xf clang.tar.gz
          CLANG_BIN="$(pwd)/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(cd "$(find . -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
          fi
          echo "Clang em: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Configure kernel (vendor/alioth_defconfig + fragment)
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Pulsar
          export KBUILD_BUILD_HOST=github-actions
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            CROSS_COMPILE=aarch64-linux-gnu- vendor/alioth_defconfig
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            CROSS_COMPILE=aarch64-linux-gnu- vendor/droidspace.config

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Pulsar
          export KBUILD_BUILD_HOST=github-actions
          make -j"$(nproc)" O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Collect kernel artifacts
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          mkdir -p out/pack
          cp out/arch/arm64/boot/Image out/pack/Image
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cat {} + > out/pack/dtb
          cp out/arch/arm64/boot/dtbo.img out/pack/dtbo.img
          ls -la out/pack/

      - name: Package AnyKernel (Pulsar AK3)
        run: |
          mkdir -p ak
          cp -r "$GITHUB_WORKSPACE/droidspace/anykernel/." ak/
          cp kernel/out/pack/Image ak/Image
          cp kernel/out/pack/dtb ak/dtb
          cp kernel/out/pack/dtbo.img ak/dtbo.img
          cd ak
          ZIP="Pulsar-${DEVICE}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP" . -x '*.git*'
          mv "$ZIP" "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-${{ env.DEVICE }}
          path: Pulsar-*.zip
          if-no-files-found: error

      - name: Create Release
        working-directory: droidspace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP="$(ls "$GITHUB_WORKSPACE"/Pulsar-*.zip)"
          RELEASE="v1.0.0-$(date +%Y%m%d-%H%M)"
          # Changelog: commits desde a última release (se existir)
          LAST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "$RELEASE" ]; then
            CHANGES="$(gh api "repos/${{ github.repository }}/compare/${LAST_TAG}...${GITHUB_SHA}" \
              --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null | sed 's/^/- /' || true)"
            printf '## O que mudou desde %s\n\n%s\n\n---\n**Base**: 4.19.404 — **Dispositivo**: %s\n\nFlash via TWRP/recovery.\n' \
              "$LAST_TAG" "$CHANGES" "$DEVICE" > NOTES.md
          else
            printf '**Primeira release Pulsar para %s** (base 4.19.404) com:\n- BPF backport 5.10/5.15 + spoof uname (suporte a ROMs A16/A17)\n- driver ntsync (Wine/Proton) - nativo\n- KernelSU-Next (rsuntk/KernelSU) - nativo\n- io_uring (v5.1 backport)\n- Multi-Gen LRU (MGLRU) backport (CONFIG_LRU_GEN=y)\n- zram com compressor zstd default\n- configs DroidSpaces\n\nFlash via TWRP/recovery.\n' \
              "$DEVICE" > NOTES.md
          fi
          gh release create "$RELEASE" "$ZIP" \
            --title "Pulsar v1.0.0 — ${DEVICE} $(date +%Y%m%d-%H%M)" \
            --notes-file NOTES.md
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$RELEASE"
