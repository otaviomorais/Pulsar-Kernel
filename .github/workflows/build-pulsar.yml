name: Build Pulsar Kernel (alioth - TIMISONG magictime-new)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Dispositivo (defconfig base)'
        required: false
        default: 'alioth'
      enable_ksu:
        description: 'Integrar KernelSU / SuSFS (true/false)'
        required: false
        default: 'true'
      apply_patches:
        description: 'Aplicar patches adicionais (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: kernel-build-pulsar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEVICE: ${{ github.event.inputs.device || 'alioth' }}
      ENABLE_KSU: ${{ github.event.inputs.enable_ksu || 'true' }}
      APPLY_PATCHES: ${{ github.event.inputs.apply_patches || 'true' }}

    steps:
      - name: Checkout patches (Pulsar-Kernel)
        uses: actions/checkout@v4
        with:
          path: droidspace

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            flex bison bc zip unzip file python3 python-is-python3 \
            libssl-dev libncurses-dev kmod cpio \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: Clone kernel source (TIMISONG-dev magictime-new)
        run: |
          git clone --depth 1 --branch magictime-new \
            https://github.com/TIMISONG-dev/kernel_xiaomi_sm8250.git kernel
          mkdir -p kernel/scripts/ufdt
          git clone --depth 1 https://android.googlesource.com/platform/system/libufdt kernel/scripts/ufdt/libufdt

      - name: Setup KernelSU-Next (submodule)
        if: env.ENABLE_KSU == 'true'
        run: |
          cd kernel
          echo "==> Inicializando KernelSU-Next submodule"
          git submodule update --init --depth 1 KernelSU-Next
          
          # Integração no build do kernel
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          if ! grep -q "drivers/kernelsu" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "drivers/kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

      - name: Apply kernel patches (patches/*/*.patch)
        if: env.APPLY_PATCHES == 'true'
        run: |
          cd kernel
          shopt -s nullglob
          for dir in "$GITHUB_WORKSPACE"/droidspace/patches/*/; do
            for patch in "$dir"*.patch; do
              basename="$(basename "$patch")"
              # Skip conflicting patches based on KSU state:
              # - nosu patch only for non-KSU builds
              # - sm8250-enhancements (KSU/SuSFS) only for KSU builds
              if [ "$ENABLE_KSU" == "true" ] && [[ "$basename" == *"nosu"* ]]; then
                echo "==> Pulando $basename (KSU habilitado, patch sem SuSFS)"
                continue
              fi
              if [ "$ENABLE_KSU" != "true" ] && [[ "$basename" == *"enhancements"* ]]; then
                echo "==> Pulando $basename (KSU desabilitado, patch SuSFS desnecessário)"
                continue
              fi
              echo "==> Aplicando $basename"
              if ! git apply --verbose "$patch"; then
                echo "WARN: $basename falhou, tentando com --3way"
                git apply --3way "$patch" || {
                  echo "ERRO: $basename não aplicável, pulando"
                }
              fi
            done
          done

      - name: Download Clang 20 (ZyCromerZ)
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz
          tar -xf clang.tar.gz
          CLANG_BIN="$(pwd)/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(cd "$(find . -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
          fi
          echo "Clang em: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Configure kernel (${{ env.DEVICE }}_defconfig + DroidSpaces)
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Pulsar
          export KBUILD_BUILD_HOST=github-actions
          
          # Base defconfig oficial dedicado do Alioth
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 PYTHON2=python3 \
            CROSS_COMPILE=aarch64-linux-gnu- vendor/xiaomi/${DEVICE}_defconfig
          
          # Se existir fragmento DroidSpaces, mescla na config
          if [ -f "$GITHUB_WORKSPACE/droidspace/configs/droidspace.config" ]; then
            echo "==> Mesclando configs do DroidSpaces"
            ./scripts/kconfig/merge_config.sh -m -O out out/.config \
              "$GITHUB_WORKSPACE/droidspace/configs/droidspace.config"
            make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 PYTHON2=python3 \
              CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          fi
          
          # Habilitar MGLRU e KernelSU se aplicável
          ./scripts/config --file out/.config -e LRU_GEN -e LRU_GEN_ENABLED
          if [ "$ENABLE_KSU" == "true" ]; then
            ./scripts/config --file out/.config -e KSU -e KSU_SUSFS
          fi

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Pulsar
          export KBUILD_BUILD_HOST=github-actions
          make -j"$(nproc)" O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 PYTHON2=python3 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            Image dtbs

      - name: Collect kernel artifacts
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          mkdir -p out/pack
          cp out/arch/arm64/boot/Image out/pack/Image
          
          # DTB dedicado para alioth (Snapdragon 870 = kona-v2.1 SoC)
          if [ -f out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb ]; then
            echo "==> Usando kona-v2.1.dtb compilado"
            cp out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb out/pack/dtb
          elif [ -f "$GITHUB_WORKSPACE/droidspace/boot-assets/dtb" ]; then
            echo "==> Usando dtb de boot-assets"
            cp "$GITHUB_WORKSPACE/droidspace/boot-assets/dtb" out/pack/dtb
          fi
          
          # DTBO dedicado para alioth (1 overlay: alioth-sm8250-overlay.dtbo)
          if [ -f out/arch/arm64/boot/dts/vendor/qcom/alioth-sm8250-overlay.dtbo ]; then
            echo "==> Criando dtbo.img dedicado para alioth"
            python3 scripts/ufdt/libufdt/utils/src/mkdtboimg.py create out/pack/dtbo.img --page_size=4096 \
              out/arch/arm64/boot/dts/vendor/qcom/alioth-sm8250-overlay.dtbo
          elif [ -f "$GITHUB_WORKSPACE/droidspace/boot-assets/dtbo.img" ]; then
            echo "==> Usando dtbo.img de boot-assets"
            cp "$GITHUB_WORKSPACE/droidspace/boot-assets/dtbo.img" out/pack/dtbo.img
          elif [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img out/pack/dtbo.img
          fi
          
          ls -la out/pack/

      - name: Package AnyKernel (Pulsar AK3)
        run: |
          mkdir -p ak
          cp -r "$GITHUB_WORKSPACE/droidspace/anykernel/." ak/
          cp kernel/out/pack/Image ak/Image
          cp kernel/out/pack/dtb ak/dtb
          if [ -f kernel/out/pack/dtbo.img ]; then
            cp kernel/out/pack/dtbo.img ak/dtbo.img
          fi
          cd ak
          ZIP="Pulsar-${DEVICE}-AOSP16-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP" . -x '*.git*'
          mv "$ZIP" "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-${{ env.DEVICE }}-AOSP16
          path: Pulsar-*.zip
          if-no-files-found: error

      - name: Create Release
        working-directory: droidspace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP="$(ls "$GITHUB_WORKSPACE"/Pulsar-*.zip)"
          RELEASE="v1.0.0-aosp16-$(date +%Y%m%d-%H%M)"
          LAST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "$RELEASE" ]; then
            CHANGES="$(gh api "repos/${{ github.repository }}/compare/${LAST_TAG}...${GITHUB_SHA}" \
              --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null | sed 's/^/- /' || true)"
            printf '## O que mudou desde %s\n\n%s\n\n---\n**Base**: TIMISONG-dev magictime-new (4.19.325) — **Dispositivo**: %s\n\nFlash via TWRP/recovery.\n' \
              "$LAST_TAG" "$CHANGES" "$DEVICE" > NOTES.md
          else
            printf '**Release Pulsar Kernel AOSP 16 para %s** (base TIMISONG-dev magictime-new 4.19.325) com:\n- Base TIMISONG-dev alioth_defconfig (magictime-new)\n- KernelSU-Next integrado via submodule\n- Backports de Syscalls (openat2, faccessat2, close_range, futex_waitv 64/32-bit)\n- KernelSU com ganchos SuSFS\n- io_uring (v5.1 backport)\n- Multi-Gen LRU (MGLRU) backport\n- zram com compressor zstd default\n- configs DroidSpaces\n- Spoof de uname + libperfmgr redirect\n\nFlash via TWRP/recovery.\n' \
              "$DEVICE" > NOTES.md
          fi
          gh release create "$RELEASE" "$ZIP" \
            --title "Pulsar AOSP 16 v1.0.0 — ${DEVICE} magictime-new $(date +%Y%m%d-%H%M)" \
            --notes-file NOTES.md
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$RELEASE"
