name: Build Pulsar Kernel (alioth - PocoF3 AOSP-16)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Dispositivo (defconfig base)'
        required: false
        default: 'alioth'
      enable_ksu:
        description: 'Integrar KernelSU / SuSFS (true/false)'
        required: false
        default: 'false'
      apply_patches:
        description: 'Aplicar patches adicionais (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: kernel-build-pulsar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEVICE: ${{ github.event.inputs.device || 'alioth' }}
      ENABLE_KSU: ${{ github.event.inputs.enable_ksu || 'false' }}
      APPLY_PATCHES: ${{ github.event.inputs.apply_patches || 'false' }}

    steps:
      - name: Checkout patches (Pulsar-Kernel)
        uses: actions/checkout@v4
        with:
          path: droidspace

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            flex bison bc zip unzip file python3 python-is-python3 \
            libssl-dev libncurses-dev kmod cpio \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: Clone kernel source (PocoF3Releases aosp-16)
        run: |
          git clone --depth 1 --branch aosp-16 \
            https://github.com/PocoF3Releases/kernel_xiaomi_sm8250.git kernel
          mkdir -p kernel/scripts/ufdt
          git clone --depth 1 https://android.googlesource.com/platform/system/libufdt kernel/scripts/ufdt/libufdt

      - name: Setup KernelSU & SuSFS
        if: env.ENABLE_KSU == 'true'
        run: |
          cd kernel
          echo "==> Setup KernelSU com SuSFS"
          git clone --depth 1 -b susfs-rksu-master https://github.com/rsuntk/KernelSU.git KernelSU
          
          # Fixes de headers SuSFS no KernelSU
          sed -i 's/#include <linux\/susfs_def\.h>/#include <linux\/susfs\.h>/g' KernelSU/kernel/sucompat.c || true
          sed -i -E 's/(susfs_[[:alnum:]_]+)\(arg\)/\1((void __user *)arg)/g' KernelSU/kernel/supercalls.c || true
          
          # Integração no build do kernel
          ln -sf ../KernelSU/kernel drivers/kernelsu
          if ! grep -q "drivers/kernelsu" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "drivers/kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

      - name: Apply kernel patches (patches/*/*.patch)
        if: env.APPLY_PATCHES == 'true'
        run: |
          cd kernel
          shopt -s nullglob
          for patch in "$GITHUB_WORKSPACE"/droidspace/patches/*/*.patch; do
            echo "==> Applying $patch"
            git apply --verbose "$patch"
          done

      - name: Download Clang 20 (ZyCromerZ)
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz
          tar -xf clang.tar.gz
          CLANG_BIN="$(pwd)/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(cd "$(find . -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
          fi
          echo "Clang em: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Configure kernel (vendor/kona-perf_defconfig + xiaomi fragments)
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Pulsar
          export KBUILD_BUILD_HOST=github-actions
          
          # Base defconfig Kona
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 PYTHON2=python3 \
            CROSS_COMPILE=aarch64-linux-gnu- vendor/kona-perf_defconfig
          
          # Merge fragmentos Xiaomi (sm8250-common + alioth)
          CONFIGS="arch/arm64/configs/vendor/xiaomi/sm8250-common.config"
          if [ -f "arch/arm64/configs/vendor/xiaomi/${DEVICE}.config" ]; then
            CONFIGS="$CONFIGS arch/arm64/configs/vendor/xiaomi/${DEVICE}.config"
          fi
          
          echo "==> Merging configs: $CONFIGS"
          ./scripts/kconfig/merge_config.sh -m -O out out/.config $CONFIGS
          
          # Atualiza a config com os defaults
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 PYTHON2=python3 \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # Habilitar KernelSU se aplicável
          if [ "$ENABLE_KSU" == "true" ]; then
            ./scripts/config --file out/.config -e KSU -e KSU_SUSFS
          fi

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Pulsar
          export KBUILD_BUILD_HOST=github-actions
          make -j"$(nproc)" O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 PYTHON2=python3 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            Image dtbs dtbo.img

      - name: Collect kernel artifacts
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          mkdir -p out/pack
          cp out/arch/arm64/boot/Image out/pack/Image
          
          # DTB nativo para alioth (Snapdragon 870 = kona-v2.1 SoC)
          if [ -f out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb ]; then
            echo "==> Usando kona-v2.1.dtb nativo compilado"
            cp out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb out/pack/dtb
          fi
          
          # DTBO nativo gerado pelo Makefile do kernel
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            echo "==> Usando dtbo.img nativo compilado"
            cp out/arch/arm64/boot/dtbo.img out/pack/dtbo.img
          fi
          
          ls -la out/pack/

      - name: Package AnyKernel (Pulsar AK3)
        run: |
          mkdir -p ak
          cp -r "$GITHUB_WORKSPACE/droidspace/anykernel/." ak/
          cp kernel/out/pack/Image ak/Image
          cp kernel/out/pack/dtb ak/dtb
          cp kernel/out/pack/dtbo.img ak/dtbo.img
          cd ak
          ZIP="Pulsar-${DEVICE}-AOSP16-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP" . -x '*.git*'
          mv "$ZIP" "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-${{ env.DEVICE }}-AOSP16
          path: Pulsar-*.zip
          if-no-files-found: error

      - name: Create Release
        working-directory: droidspace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP="$(ls "$GITHUB_WORKSPACE"/Pulsar-*.zip)"
          RELEASE="v1.0.0-aosp16-$(date +%Y%m%d-%H%M)"
          LAST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "$RELEASE" ]; then
            CHANGES="$(gh api "repos/${{ github.repository }}/compare/${LAST_TAG}...${GITHUB_SHA}" \
              --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null | sed 's/^/- /' || true)"
            printf '## O que mudou desde %s\n\n%s\n\n---\n**Base**: PocoF3Releases aosp-16 (4.19.325) — **Dispositivo**: %s\n\nFlash via TWRP/recovery.\n' \
              "$LAST_TAG" "$CHANGES" "$DEVICE" > NOTES.md
          else
            printf '**Release Pulsar Kernel AOSP 16 para %s** (base PocoF3Releases 4.19.325) com:\n- Base AOSP 16 / LineageOS / Evolution X\n- BPF backports + spoof uname\n- Syscalls openat2, clone3, faccessat2, futex_waitv (FEX-Emu / Wine)\n- KernelSU com ganchos SuSFS\n- io_uring (v5.1 backport)\n- Multi-Gen LRU (MGLRU) backport (CONFIG_LRU_GEN=y)\n- zram com compressor zstd default\n- configs DroidSpaces\n\nFlash via TWRP/recovery.\n' \
              "$DEVICE" > NOTES.md
          fi
          gh release create "$RELEASE" "$ZIP" \
            --title "Pulsar AOSP 16 v1.0.0 — ${DEVICE} $(date +%Y%m%d-%H%M)" \
            --notes-file NOTES.md
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$RELEASE"
